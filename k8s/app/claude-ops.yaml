# Read access to the eunomia namespace for claude-ops, the account a Claude
# session on neptune uses instead of root (defined in the Plutus repository:
# deploy/k8s/neptune/plutus/claude-ops.yaml; AGENTS.md, Operating on
# neptune). Modelled on beholder's k8s/claude-ops.yaml.
#
# It can read pods, logs, events, services, volumes, workloads and the
# network policies, and create Jobs, so a session can run a CronJob now
# (`kubectl create job --from=cronjob/roster …`) after a deploy or a
# failure (owner, 2026-11-23). Kubernetes cannot limit that to copies of
# the CronJobs: a created Job may run any image and mount the data volume.
# The namespace's guards still hold (Restricted pods, the NetworkPolicy),
# and it cannot delete or change anything else. It cannot read Secrets
# directly, but a Job it creates could mount one: that is harmless only
# while the namespace holds none. Revisit this grant before E4b puts the
# api.data.gov key here (docs/roadmap.md, E4b).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-ops
  namespace: eunomia
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints", "persistentvolumeclaims", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-ops
  namespace: eunomia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-ops
subjects:
  - kind: ServiceAccount
    name: claude-ops
    namespace: plutus
